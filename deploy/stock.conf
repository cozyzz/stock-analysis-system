# stock-analysis-system · nginx 配置（8080 高端口 + gzip）
# 装载：cp /opt/stock-analysis-system/deploy/stock.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# 不用 80/443：国内云商无备案会拦；8080 高端口不拦、不需备案。
# gzip：18MB 自包含 HTML 压到 ~6MB 传输，6Mbps 下从 27s 降到 ~9s（冷加载）。
server {
    listen 8080;
    server_name _;
    root /var/www/stock;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    # 不写 text/html：nginx 默认就压它，写了报 "duplicate MIME type" 警告（无害但脏）
    gzip_types text/plain application/json application/javascript text/css;

    location / { try_files $uri $uri/ /index.html; }
}
