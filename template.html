<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>__DASH_TITLE__</title>
<style>
:root{--bg:#0b0e14;--panel:#12161f;--panel2:#161b26;--line:#1f2530;--text:#cfd3dc;--muted:#5a6482;--up:#ff4d4f;--down:#00b578;--gold:#e0a94e;--info:#4a90e2;--warn:#ff9a2e;--bad:#f76560;--good:#23c343}
html[data-theme="light"]{--bg:#f4f6fa;--panel:#fff;--panel2:#f7f9fc;--line:#e7eaf0;--text:#2c3138;--muted:#8a93a3;--up:#e63946;--down:#1ba659;--gold:#b8860b;--info:#2f6fd0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,"Microsoft YaHei",sans-serif}
.navrow{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding-right:16px}
.nav{display:flex;gap:2px;padding:0 0 0 16px;background:transparent;border:none}
.navright{display:flex;align-items:center;gap:14px}
.navright .asof{color:var(--muted);font-size:12px;white-space:nowrap}
.navright button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.nav button{background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;font-size:13px}
.nav button{background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;font-size:13px}
.nav button.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav button:disabled{color:var(--muted);opacity:.5;cursor:not-allowed}
.kbtn{background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:12px}.kbtn.active{color:var(--gold);border-color:var(--gold)}.hsel{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:12px;margin-left:6px}.stratcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.stratcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s}.stratcard:hover{border-color:var(--info)}.stratcard.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.stratcard .sn{font-weight:600;font-size:14px}.stratcard .sd{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}.stratcard .sm{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:12px}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
.section{display:none}
.section.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.kpi .lbl{color:var(--muted);font-size:11px}
.kpi .val{font-size:20px;font-weight:600;margin-top:2px}
.kpi .sub{font-size:11px;color:var(--muted)}
.pos{color:var(--up)}.neg{color:var(--down)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.panel h3{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
.panel .note{font-size:11px;color:var(--muted);margin-top:6px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.charts-row{grid-template-columns:1fr}}
canvas{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);cursor:pointer;position:sticky;top:0;background:var(--panel)}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:var(--panel2);color:var(--muted)}
.tag.pending{color:var(--warn)}
.tbl-wrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:6px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
#drawer{position:fixed;top:0;right:0;width:min(1100px,94vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:16px}
#drawer.open{transform:translateX(0)}
#dwTitle{font-size:15px;font-weight:600;margin-bottom:2px}
#dwSub{font-size:12px;color:var(--muted);margin-bottom:10px}
#dwClose{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
#dwBody{font-size:12px;margin-top:10px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin-top:6px}
.kv .k{color:var(--muted)}
#tip{position:fixed;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:11px;pointer-events:none;display:none;white-space:nowrap}
.alert{background:var(--panel);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:6px;margin-bottom:14px}
.placeholder{color:var(--muted);text-align:center;padding:60px 0;font-size:13px}
.disclaimer{color:var(--muted);font-size:11px;text-align:center;padding:16px 0;border-top:1px solid var(--line);margin-top:16px}
</style>
</head>

</div>

<div id="drawer"><button id="dwClose" onclick="closeDrawer()">×</button><div id="dwTitle"></div><div id="dwSub"></div><canvas id="cvK" height="280"></canvas><div id="dwBody"></div></div>

<script>

// ===== 收益曲线：每信号日 avg5c 散点 + 累计均值线 =====
function drawCurve(hz){hz=hz||1;var cv=$("cvCurve");var sec=secOf("strategy");if(!sec||!sec.by_date||!sec.by_date.length){empty(cv,"收益曲线","无已实现信号");return}var o=setup(cv,240);var ctx=o.ctx,w=o.w,h=o.h,pad=34;var arr=sec.by_date;var key="avg"+hz+"c";var vals=arr.map(function(a){return a[key]}).filter(function(v){return v!=null});if(!vals.length){empty(cv,"收益曲线","无已实现 "+hLabel(hz)+" 收益");return}var mn=Math.min(-0.05,Math.min.apply(null,vals)),mx=Math.max(0.05,Math.max.apply(null,vals)),rg=mx-mn||1;mn-=rg*0.1;mx+=rg*0.1;axis(ctx,w,h,pad,mn,mx,true);var n=arr.length,xw=w-2*pad;ctx.fillStyle=css("--up");for(var i=0;i<n;i++){if(arr[i][key]==null)continue;var x=pad+(n==1?xw/2:xw*i/(n-1));var y=pad+(h-2*pad)*(1-(arr[i][key]-mn)/(mx-mn));ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill()}var acc=0,cnt=0,pts=[];for(var i=0;i<n;i++){if(arr[i][key]==null)continue;cnt++;acc+=arr[i][key];var mean=acc/cnt;var x=pad+(n==1?xw/2:xw*i/(n-1));var y=pad+(h-2*pad)*(1-(mean-mn)/(mx-mn));pts.push([x,y])}ctx.strokeStyle=css("--gold");ctx.lineWidth=1.5;ctx.beginPath();for(var i=0;i<pts.length;i++){if(i==0)ctx.moveTo(pts[i][0],pts[i][1]);else ctx.lineTo(pts[i][0],pts[i][1])}ctx.stroke();var ne=$("curveNote");if(ne)ne.textContent="x=信号日，y=该日所有信号 "+hLabel(hz)+" 均值（c→c 收盘买→收盘卖）；金线=截至当日累计均值。非真实组合净值。";CHART_STATE["cvCurve"]={hit:function(x,y){var i=Math.round((x-pad)/xw*(n-1));if(i<0||i>=n)return null;var a=arr[i];return{html:a.date+"<br>信号 "+a.n+" 个<br>"+hLabel(hz)+"均值 "+fmt(a[key]),clickable:false}}}}

function drawK(sym,date,sg){var cv=$("cvK");var sec=secOf("strategy");var charts=sec?sec.charts:{};var g=charts[sym+"|"+date];if(!g){empty(cv,"K 线","该信号未内联图数据（仅最近 "+(sec?sec.signals.length:0)+" 个有图）");return}var o=setup(cv,460);var ctx=o.ctx,w=o.w,h=o.h;var n=g.d.length,si=g.signal_idx;var pad=26;var yM0=pad,yM1=pad+300;var yD0=yM1+8,yD1=yD0+80;var yV0=yD1+6,yV1=yV0+40;var xs=w-2*pad;var allh=g.h.concat(g.l),mn=Math.min.apply(null,allh),mx=Math.max.apply(null,allh),rg=mx-mn||1;mn-=rg*0.08;mx+=rg*0.08;function X(i){return pad+(n==1?xs/2:xs*i/(n-1))}function Ym(v){return yM0+300*(1-(v-mn)/(mx-mn))}var cw=xs/n,bw=Math.max(1.5,cw*0.7);ctx.font="10px sans-serif";ctx.fillStyle=css("--muted");ctx.textAlign="left";ctx.fillText(num(mx),2,yM0+4);ctx.fillText(num(mn),2,yM1-2);ctx.fillText("MACD",2,yD0+10);var pco=g.o[si],pcc=g.c[si],pch=g.h[si],pcl=g.l[si],ppc=si>0?g.c[si-1]:null;var pchg=(ppc!=null)?(pcc/ppc-1)*100:null;var pup=(ppc!=null)?(pcc>=ppc):true;ctx.textAlign="left";ctx.fillStyle=css("--muted");ctx.font="10px sans-serif";ctx.fillText("信号日",pad,13);ctx.fillStyle=pup?css("--up"):css("--down");ctx.font="bold 13px sans-serif";ctx.fillText(num(pcc),pad+42,13);ctx.font="10px sans-serif";if(pchg!=null)ctx.fillText((pchg>=0?"+":"")+pchg.toFixed(2)+"%",pad+92,13);ctx.fillStyle=css("--muted");ctx.fillText("开"+num(pco)+" 高"+num(pch)+" 低"+num(pcl)+" 昨收"+num(ppc),pad+150,13);ctx.fillStyle="rgba(224,169,78,0.08)";ctx.fillRect(X(si)+cw/2,yM0,cw*5,yM1-yM0);function hline(v,col,dash){if(v==null||isNaN(v)||v<mn||v>mx)return;var y=Ym(v);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font="9px sans-serif";ctx.fillText(v.toFixed(2),w-pad-30,y-3)}if(g.zt_up)hline(g.zt_up[si],css("--up"),[3,3]);if(g.zt_dn)hline(g.zt_dn[si],css("--down"),[3,3]);for(var i=0;i<n;i++){var up=g.c[i]>=g.o[i];var col=up?css("--up"):css("--down");ctx.strokeStyle=col;ctx.fillStyle=col;var x=X(i); function renderNav(){var nav=$("nav");var html="";for(var i=0;i<MODULES.length;i++){var m=MODULES[i];var en=D&&D.sections&&D.sections[m.key];html+='<button '+(en?"":"disabled")+' data-key="'+m.key+'">'+m.name+(en?"":"·构建中")+'</button>'}nav.innerHTML=html;var bs=nav.querySelectorAll("button");for(var i=0;i<bs.length;i++){bs[i].onclick=function(){if(this.disabled)return;showSection(this.dataset.key)}}showSection(D&&D.active||"strategy")}
function showSection(key){var bs=document.querySelectorAll(".nav button");for(var i=0;i<bs.length;i++){bs[i].classList.toggle("active",bs[i].dataset.key==key)}var secs=document.querySelectorAll(".section");for(var i=0;i<secs.length;i++){secs[i].classList.toggle("active",secs[i].id=="sec-"+key)}if(key=="market")renderMarket();else if(key=="strategy")renderStrategy();else if(key=="stock")renderStock();else if(key=="analysis")renderAnalysis();setTimeout(function(){if(key=="market")drawDistM();else if(key=="strategy"){drawCurve();drawDist();applyCost()}else if(key=="analysis"){drawYear();drawMonth();drawDecay()}},50)}
function toggleTheme(){var h=document.documentElement;h.setAttribute("data-theme",h.getAttribute("data-theme")=="dark"?"light":"dark");var cur=document.querySelector(".section.active");if(cur){if(cur.id=="sec-market")renderMarket();else if(cur.id=="sec-strategy")renderStrategy();else if(cur.id=="sec-stock")renderStock();else if(cur.id=="sec-analysis")renderAnalysis()}}
document.addEventListener("keydown",function(e){if(e.key=="Escape")closeDrawer()});
window.addEventListener("resize",function(){var cur=document.querySelector(".section.active");if(!cur)return;if(cur.id=="sec-market")renderMarket();else if(cur.id=="sec-strategy")showSection("strategy");else if(cur.id=="sec-stock"&&CHART_STATE["stockIdx"]!=null)drawStockK(CHART_STATE["stockIdx"]);else if(cur.id=="sec-analysis")renderAnalysis()});
function init(){if(!D){document.getElementById("alerts").innerHTML='<div class="alert">⚠ 数据加载失败：HTML 内没有找到数据。请重新运行 run.py 生成看板。</div>';return}$("asof").textContent="数据截止 "+(D.meta.data_asof||"?")+"　耗时 "+(D.meta.elapsed_sec||0)+"s";bindChart("cvK",null,null);renderNav()}
init();
</script>
